/* 可愛手帳風 */

.tabs button{background:var(--card);color:var(--ink);box-shadow:none}

input,select{border:2px solid var(--line);border-radius:14px}
.total{font-size:2.6rem}
.bar{height:14px;border:2px solid var(--ink);background:var(--card)}
.bar>div{background:var(--mint);border-radius:999px}

</style>
</head>
<body>
<main>
  <h1>TRAVEL PLANNER</h1>
  <p class="sub">航班、住宿、花費，一本搞定。</p>
  <svg class="hero" viewBox="0 0 560 220" role="img" aria-label="手繪插畫：清水寺、楓葉樹與一列小火車">
  <defs><path id="mp" d="M12 2L13.8 5.6L17 4.4L16.2 8.4L20 8L18 11.2L20.6 13L16.6 14L17.2 16.6L12.8 15.6L12.8 22L11.2 22L11.2 15.6L6.8 16.6L7.4 14L3.4 13L6 11.2L4 8L7.8 8.4L7 4.4L10.2 5.6Z"/><pattern id="sl" width="16" height="10" patternUnits="userSpaceOnUse"><rect x="5" width="6" height="10" fill="#B07A45"/></pattern></defs>

  <rect x="182" y="102" width="116" height="30" fill="#E0452F"/>

  <g><rect x="66" y="128" width="8" height="46" fill="#7A4A2A"/><circle cx="70" cy="112" r="24" fill="#D9473F"/><circle cx="50" cy="126" r="17" fill="#E8603C"/><circle cx="92" cy="126" r="17" fill="#D9473F"/></g>

  <use href="#mp" transform="translate(110 36) rotate(20) scale(1.2)" fill="#E8603C"/><use href="#mp" transform="translate(300 24) rotate(-30)" fill="#D9473F"/><use href="#mp" transform="translate(440 52) rotate(40) scale(1.3)" fill="#F2A33A"/><use href="#mp" transform="translate(24 66) rotate(-10)" fill="#F2A33A"/>
  <rect y="184" width="560" height="36" fill="#FFFAEC"/><rect y="198" width="560" height="10" fill="url(#sl)"/><rect y="197" width="560" height="3" fill="#8A5A33"/><rect y="206" width="560" height="3" fill="#8A5A33"/>
  <rect x="326" y="158" width="108" height="36" rx="8" fill="#F4A259"/><rect x="326" y="184" width="108" height="5" fill="#FFF4D6"/>
  <g fill="#FFF4D6"><rect x="338" y="164" width="22" height="16" rx="3"/><rect x="368" y="164" width="22" height="16" rx="3"/><rect x="398" y="164" width="22" height="16" rx="3"/></g>
  <g fill="#F3DCCB" stroke="#C9A98F" stroke-width=".8"><ellipse cx="373" cy="162" rx="3" ry="8"/><ellipse cx="385" cy="162" rx="3" ry="8"/><circle cx="379" cy="175" r="7.5"/></g><g fill="#F4A6B8"><ellipse cx="373" cy="162" rx="1.3" ry="5.5"/><ellipse cx="385" cy="162" rx="1.3" ry="5.5"/><circle cx="373" cy="178" r="1.8" opacity=".6"/><circle cx="385" cy="178" r="1.8" opacity=".6"/></g><g fill="#3B2A1E"><circle cx="376" cy="174" r="1.2"/><circle cx="382" cy="174" r="1.2"/></g><circle cx="379" cy="177" r="1.3" fill="#E8789A"/>

  <rect x="484" y="132" width="12" height="20" fill="#3B2A1E"/><rect x="480" y="128" width="20" height="6" rx="2" fill="#3B2A1E"/>
  <g fill="#FFFFFF" opacity=".92"><circle cx="494" cy="116" r="7"/><circle cx="506" cy="102" r="9"/><circle cx="522" cy="88" r="11"/></g>
  <g fill="#3B2A1E"><circle cx="350" cy="197" r="7"/><circle cx="410" cy="197" r="7"/><circle cx="458" cy="197" r="7"/><circle cx="494" cy="197" r="7"/></g>
  </svg>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="home" aria-selected="true">🏠 主頁</button>
    <button role="tab" data-tab="flights" aria-selected="false">✈️ 航班</button>
    <button role="tab" data-tab="hotels" aria-selected="false">🏨 住宿</button>
    <button role="tab" data-tab="plans" aria-selected="false">🗓️ 行程</button>
    <button role="tab" data-tab="money" aria-selected="false">💴 花費</button>
  </div>

  <div id='p-home'>
    <section class='card' id='hStatus' aria-live='polite'></section>
    <div id='hBody'></div>
    <section class='card'>
      <h2>快速記帳</h2>
      <div class='row'>
        <div class='f full'><label for='qName'>項目</label><input id='qName' placeholder='例如：晚餐拉麵'></div>
        <div class='f'><label for='qYen'>金額（日圓）</label><input id='qYen' type='number' inputmode='numeric' min='0'></div>
        <div class='f'><label for='qPayer'>誰付的</label><select id='qPayer'><option value='me'>我</option><option value='friend'>朋友</option></select></div>
      </div>
      <div class='row' style='margin-top:8px'><div class='f full'><label for='qCat'>分類</label><select id='qCat'><option value='food'>🍜 餐飲</option><option value='transport'>🚃 交通</option><option value='shop'>🛍️ 購物</option><option value='ticket'>🎫 門票</option><option value='stay'>🏨 住宿</option><option value='other'>✨ 其他</option></select></div></div>
      <label class='chk'><input type='checkbox' id='qShared' checked> 兩人平分</label>
      <button id='qAdd'>記一筆</button>
      <div class='sub' id='qMsg' role='status' style='margin:10px 0 0'></div>
    </section>
  </div>

  <div id="p-flights" hidden>
    <section class="card">
      <h2>新增航班</h2>
      <div class="row">
        <div class="f"><label for="fDir">去程或回程</label><select id="fDir"><option>去程</option><option>回程</option></select></div>
        <div class="f"><label for="fNo">航空公司與班次</label><input id="fNo" placeholder="例如：長榮 BR132"></div>
        <div class="f"><label for="fDep">出發時間</label><input id="fDep" type="datetime-local"></div>
        <div class="f"><label for="fArr">抵達時間</label><input id="fArr" type="datetime-local"></div>
        <div class="f"><label for="fFrom">出發機場</label><input id="fFrom" placeholder="桃園 TPE"></div>
        <div class="f"><label for="fTo">抵達機場</label><input id="fTo" placeholder="關西 KIX"></div>
        <div class="f full"><label for="fNote">備註（訂位代號、行李額度）</label><input id="fNote"></div>
      </div>
      <p style="margin:12px 0 0"><button id="fAdd">新增航班</button></p>
    </section>
    <section class="card"><h2>我的航班</h2><div id="fList"></div></section>
  </div>

  <div id="p-hotels" hidden>
    <section class="card">
      <h2>新增住宿</h2>
      <div class="row">
        <div class="f full"><label for="hName">住宿名稱</label><input id="hName" placeholder="例如：京都四条某某飯店"></div>
        <div class="f full"><label for="hAddr">地址（填了，地圖定位更準）</label><input id="hAddr"></div>
        <div class="f"><label for="hIn">入住日</label><input id="hIn" type="date"></div>
        <div class="f"><label for="hOut">退房日</label><input id="hOut" type="date"></div>
        <div class="f full"><label for="hNote">備註（訂房編號、入住時間）</label><input id="hNote"></div>
      </div>
      <p style="margin:12px 0 0"><button id="hAdd">新增住宿</button></p>
    </section>
    <section class="card"><h2>我的住宿</h2><div id="hList"></div></section>
  </div>

  <div id="p-plans" hidden>
    <section class="card">
      <h2 id="pHead">新增行程</h2>
      <div class="row">
        <div class="f"><label for="pDate">日期</label><input id="pDate" type="date"></div>
        <div class="f"><label for="pTime">時間（選填）</label><input id="pTime" type="time"></div>
        <div class="f full"><label for="pName">景點或活動</label><input id="pName" placeholder="例如：清水寺"></div>
        <div class="f full"><label for="pAddr">地址或地圖關鍵字（選填，越精準越好）</label><input id="pAddr" placeholder="例如：清水寺 京都市東山區"></div>
        <div class="f full"><label for="pNote">備註（門票、交通、預約）</label><input id="pNote"></div>
      </div>
      <p style="margin:12px 0 0"><button id="pAdd">新增到行程</button> <button id="pCancel" class="ghost" hidden>取消編輯</button></p>
    </section>
    <div class="chips" id="pChips"></div>
    <div id="pDays"></div>
  </div>

  <div id="p-money" hidden>
    <section class="card" aria-live="polite">
      <div class="total" id="totalJpy">¥0</div>
      <div class="twd" id="totalTwd">約 NT$0</div>
      <div class="bar" id="bar"><div></div></div>
      <div class="sub" id="budgetNote" style="margin:0"></div>
    </section>
    <section class="card">
      <h2>設定</h2>
      <div class="row">
        <div class="f"><label for="rate">匯率（1 日圓＝幾元台幣）</label><input id="rate" type="number" step="0.001" min="0" value="0.21"></div>
        <div class="f"><label for="budget">總預算（日圓）</label><input id="budget" type="number" min="0" value="150000"></div>
      </div>
      <div class="sub" style="margin:8px 0 0">匯率請出發前自行查最新數字再更新。</div>
    </section>
    <section class="card">
      <h2>新增一筆花費</h2>
      <div class="row">
        <div class="f full"><label for="name">項目</label><input id="name" placeholder="例如：清水寺附近的抹茶"></div>
        <div class="f"><label for="yen">金額（日圓）</label><input id="yen" type="number" inputmode="numeric" min="0"></div>
        <div class="f"><label for="payer">誰付的</label><select id="payer"><option value="me">我</option><option value="friend">朋友</option></select></div>
      </div>
      <div class="row" style="margin-top:8px"><div class="f full"><label for="cat">分類</label><select id="cat"><option value="food">🍜 餐飲</option><option value="transport">🚃 交通</option><option value="shop">🛍️ 購物</option><option value="ticket">🎫 門票</option><option value="stay">🏨 住宿</option><option value="other">✨ 其他</option></select></div></div>
      <label class="chk"><input type="checkbox" id="shared" checked> 兩人平分</label>
      <button id="add">新增花費</button>
    </section>
    <section class="card"><h2>花費視覺化</h2><div id="mCharts"></div></section>
    <section class="card"><h2>分帳結果</h2><div class="settle" id="settle">還沒有共同花費</div></section>
    <section class="card"><h2>花費明細</h2><div id="list"></div></section>
  </div>
</main>

<script>
(function(){
  var KEY="kyoto-trip-v1";
  var state={rate:0.21,budget:150000,items:[],flights:[],hotels:[]};
  try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(p&&typeof p==="object"){for(var k in p)state[k]=p[k];}}}catch(e){}
  ["items","flights","hotels"].forEach(function(k){if(!Array.isArray(state[k]))state[k]=[];});
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var fmt=function(n){return Math.round(n).toLocaleString("en-US")};
  var show=function(t){return t?t.replace("T"," "):"未填"};
  function el(tag,text,cls){var e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e;}
  function empty(box,msg){box.appendChild(el("div",msg,"empty"));}
  function closeMenus(){document.querySelectorAll(".kmenu").forEach(function(m){m.hidden=true;});document.querySelectorAll(".kbtn").forEach(function(b){b.setAttribute("aria-expanded","false");});}
  document.addEventListener("click",closeMenus);
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMenus();});
  function kebab(label,acts){
    var w=el("div",null,"kb"),b=el("button","⋯","kbtn"),m=el("div",null,"kmenu");
    b.setAttribute("aria-label",label+" 的更多操作");b.setAttribute("aria-haspopup","true");b.setAttribute("aria-expanded","false");m.hidden=true;
    acts.forEach(function(a){var x=el("button",a[0],a[2]?"danger":"");x.onclick=function(e){e.stopPropagation();closeMenus();a[1]();};m.appendChild(x);});
    b.onclick=function(e){e.stopPropagation();var wasOpen=!m.hidden;closeMenus();if(!wasOpen){m.hidden=false;b.setAttribute("aria-expanded","true");}};
    w.appendChild(b);w.appendChild(m);return w;
  }
  function delBtn(label,fn){return kebab(label,[["刪除",fn,true]]);}

  /* tabs */
  var tabs=document.querySelectorAll(".tabs button");
  tabs.forEach(function(b){b.onclick=function(){
    tabs.forEach(function(x){var on=x===b;x.setAttribute("aria-selected",on);$("p-"+x.dataset.tab).hidden=!on;});
  };});

  /* flights */
  function renderFlights(){
    var box=$("fList");box.innerHTML="";
    if(!state.flights.length){empty(box,"還沒有航班，從上方新增。");return;}
    state.flights.slice().sort(function(a,b){return (a.dep||"").localeCompare(b.dep||"")}).forEach(function(f){
      var d=el("div",null,"item"),l=el("div");
      var t=el("div");t.appendChild(el("span",f.dir,"tag"));t.appendChild(document.createTextNode(f.no||"（未填班次）"));
      l.appendChild(t);
      l.appendChild(routeViz(f));
      l.appendChild(el("small","出發 "+show(f.dep)+"　抵達 "+show(f.arr)));
      if(f.note)l.appendChild(el("small","備註："+f.note));
      d.appendChild(l);d.appendChild(delBtn(f.no||"航班",function(){state.flights=state.flights.filter(function(x){return x.id!==f.id});save();renderFlights();}));
      box.appendChild(d);
    });
  }
  $("fAdd").onclick=function(){
    if(!$("fNo").value.trim()&&!$("fDep").value){alert("請至少填寫班次或出發時間。");return;}
    state.flights.push({id:Date.now(),dir:$("fDir").value,no:$("fNo").value.trim(),dep:$("fDep").value,arr:$("fArr").value,from:$("fFrom").value.trim(),to:$("fTo").value.trim(),note:$("fNote").value.trim()});
    ["fNo","fDep","fArr","fFrom","fTo","fNote"].forEach(function(i){$(i).value="";});
    save();renderFlights();
  };

  /* hotels */
  function renderHotels(){
    var box=$("hList");box.innerHTML="";
    if(!state.hotels.length){empty(box,"還沒有住宿，從上方新增。");return;}
    state.hotels.slice().sort(function(a,b){return (a.inD||"").localeCompare(b.inD||"")}).forEach(function(h){
      var d=el("div",null,"item"),l=el("div");
      l.appendChild(el("div",h.name));
      l.appendChild(el("small",(h.inD||"?")+" 入住　"+(h.outD||"?")+" 退房"));
      if(h.addr)l.appendChild(el("small",h.addr));
      if(h.note)l.appendChild(el("small","備註："+h.note));
      var a=el("a","在 Google 地圖開啟","map");
      a.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(h.addr||h.name);
      a.target="_blank";a.rel="noopener noreferrer";
      l.appendChild(a);
      d.appendChild(l);d.appendChild(delBtn(h.name,function(){state.hotels=state.hotels.filter(function(x){return x.id!==h.id});save();renderHotels();}));
      box.appendChild(d);
    });
  }
  $("hAdd").onclick=function(){
    if(!$("hName").value.trim()){alert("請填寫住宿名稱。");return;}
    state.hotels.push({id:Date.now(),name:$("hName").value.trim(),addr:$("hAddr").value.trim(),inD:$("hIn").value,outD:$("hOut").value,note:$("hNote").value.trim()});
    ["hName","hAddr","hIn","hOut","hNote"].forEach(function(i){$(i).value="";});
    save();renderHotels();
  };

  /* money */
  function renderMoney(){renderCharts();
    $("rate").value=state.rate;$("budget").value=state.budget;
    var total=0,paid=0,shared=0;
    state.items.forEach(function(i){total+=i.yen;if(i.shared){shared+=i.yen;if(i.payer==="me")paid+=i.yen;}});
    $("totalJpy").textContent="¥"+fmt(total);
    $("totalTwd").textContent="約 NT$"+fmt(total*state.rate);
    $("bar").firstElementChild.style.width=(state.budget>0?Math.min(100,total/state.budget*100):0)+"%";
    var left=state.budget-total;
    $("bar").className="bar"+(left<0?" over":"");
    $("budgetNote").textContent=state.budget>0?(left>=0?"預算還剩 ¥"+fmt(left)+"（約 NT$"+fmt(left*state.rate)+"）":"已超出預算 ¥"+fmt(-left)):"";
    var net=paid-shared/2,st=$("settle");
    if(shared===0)st.textContent="還沒有共同花費";
    else if(Math.abs(net)<1)st.textContent="目前互不相欠";
    else if(net>0)st.textContent="朋友要給我 ¥"+fmt(net)+"（約 NT$"+fmt(net*state.rate)+"）";
    else st.textContent="我要給朋友 ¥"+fmt(-net)+"（約 NT$"+fmt(-net*state.rate)+"）";
    var box=$("list");box.innerHTML="";
    if(!state.items.length){empty(box,"還沒有花費，從上方新增第一筆吧。");return;}
    state.items.slice().reverse().forEach(function(i){
      var d=el("div",null,"item"),l=el("div");
      l.appendChild(el("div",(CATS[i.cat]?CATS[i.cat][0]:'✨')+' '+i.name));
      l.appendChild(el("small",(i.payer==="me"?"我付":"朋友付")+(i.shared?"，兩人平分":"，個人花費")));
      var r=el("div","¥"+fmt(i.yen),"amt");r.appendChild(el("small","NT$"+fmt(i.yen*state.rate)));
      d.appendChild(l);d.appendChild(r);
      d.appendChild(delBtn(i.name,function(){state.items=state.items.filter(function(x){return x.id!==i.id});save();renderMoney();}));
      box.appendChild(d);
    });
  }
  $("add").onclick=function(){
    var name=$("name").value.trim(),yen=parseFloat($("yen").value);
    if(!name||!(yen>0)){alert("請填寫項目名稱和大於 0 的金額。");return;}
    state.items.push({id:Date.now(),name:name,yen:yen,payer:$("payer").value,shared:$("shared").checked,cat:$("cat").value});
    $("name").value="";$("yen").value="";save();renderMoney();$("name").focus();
  };
  $("rate").onchange=function(){var v=parseFloat(this.value);if(v>0){state.rate=v;save();}renderMoney();};
  $("budget").onchange=function(){var v=parseFloat(this.value);state.budget=v>=0?v:0;save();renderMoney();};

  /* 每日行程 */
  if(!Array.isArray(state.plans))state.plans=[];
  var WD=["日","一","二","三","四","五","六"];
  function qs(p){return encodeURIComponent(p.addr||p.name);}
  function dayLabel(d,n){var t=new Date(d+"T00:00:00");return "Day "+n+"｜"+(t.getMonth()+1)+"/"+t.getDate()+"（"+WD[t.getDay()]+"）";}
  function renderPlans(){
    var box=$("pDays");box.innerHTML="";$("pChips").innerHTML="";
    if(!state.plans.length){var c0=el("section",null,"card");empty(c0,"還沒有行程，先新增第一個景點吧。");box.appendChild(c0);return;}
    var days={};
    state.plans.forEach(function(p){(days[p.date]=days[p.date]||[]).push(p);});
    Object.keys(days).sort().forEach(function(d,idx){
      var list=days[d].sort(function(a,b){return (a.time||"99:99").localeCompare(b.time||"99:99");});
      var c=el("section",null,"card");c.appendChild(el("h2",dayLabel(d,idx+1)));
      list.forEach(function(p){
        var it=el("div",null,"item"),l=el("div"),t=el("div");
        if(p.time)t.appendChild(el("span",p.time,"tag time"));
        t.appendChild(document.createTextNode(p.name));l.appendChild(t);
        if(p.addr)l.appendChild(el("small",p.addr));
        if(p.note)l.appendChild(el("small","備註："+p.note));
        var a=el("a","📍","map");a.setAttribute("aria-label","在 Google 地圖開啟："+p.name);a.title="在 Google 地圖開啟";
        a.className="map side";a.href="https://www.google.com/maps/search/?api=1&query="+qs(p);a.target="_blank";a.rel="noopener noreferrer";
        it.appendChild(l);it.appendChild(a);
        it.appendChild(kebab(p.name,[["編輯",function(){startEdit(p);}],["刪除",function(){state.plans=state.plans.filter(function(x){return x.id!==p.id;});if(editId===p.id)endEdit();save();renderPlans();},true]]));
        c.appendChild(it);
      });
      c.id='day-'+d;c.style.scrollMarginTop='76px';
      var chip=el('button','Day '+(idx+1)+' · '+fmtMD(d).split('（')[0]+(d===ymd(new Date())?' · 今天':''),'chipb'+(d===ymd(new Date())?' today':''));
      chip.onclick=function(){c.scrollIntoView({behavior:'smooth',block:'start'});};
      $("pChips").appendChild(chip);
      box.appendChild(c);
    });
  }
  var editId=null;
  function startEdit(p){
    editId=p.id;
    $("pDate").value=p.date;$("pTime").value=p.time||"";$("pName").value=p.name;$("pAddr").value=p.addr||"";$("pNote").value=p.note||"";
    $("pHead").textContent="編輯行程";$("pAdd").textContent="儲存修改";$("pCancel").hidden=false;
    $("pName").scrollIntoView({behavior:"smooth",block:"center"});$("pName").focus();
  }
  function endEdit(){
    editId=null;$("pHead").textContent="新增行程";$("pAdd").textContent="新增到行程";$("pCancel").hidden=true;
  }
  $("pCancel").onclick=function(){endEdit();["pTime","pName","pAddr","pNote"].forEach(function(i){$(i).value="";});};
  $("pAdd").onclick=function(){
    if(!$("pDate").value||!$("pName").value.trim()){alert("請至少填寫日期和景點名稱。");return;}
    var rec={id:editId||Date.now(),date:$("pDate").value,time:$("pTime").value,name:$("pName").value.trim(),addr:$("pAddr").value.trim(),note:$("pNote").value.trim()};
    if(editId&&state.plans.some(function(x){return x.id===editId;})){state.plans=state.plans.map(function(x){return x.id===editId?rec:x;});}else{state.plans.push(rec);}
    endEdit();
    ["pTime","pName","pAddr","pNote"].forEach(function(i){$(i).value="";});
    save();renderPlans();$("pName").focus();
  };

  /* 主頁 */
  if(!Array.isArray(state.todos))state.todos=[];
  if(!state.todoSeeded){['護照（確認效期）','Visit Japan Web 入境登錄','eSIM／網路','日幣現金','旅遊保險','手機充電器與行動電源（手提登機）','雨具與保暖外套','訂房與機票確認信備份'].forEach(function(t,i){state.todos.push({id:Date.now()+i,text:t,done:false});});state.todoSeeded=true;save();}
  function z2(n){return n<10?'0'+n:''+n;}
  function ymd(d){return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());}
  function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
  function fmtMD(d){var t=new Date(d+'T00:00:00');return (t.getMonth()+1)+'/'+t.getDate()+'（'+WD[t.getDay()]+'）';}
  function tripRange(){
    var ds=[];
    state.plans.forEach(function(p){if(p.date)ds.push(p.date);});
    state.flights.forEach(function(f){if(f.dep)ds.push(f.dep.slice(0,10));if(f.arr)ds.push(f.arr.slice(0,10));});
    if(!ds.length)return null;ds.sort();return {start:ds[0],end:ds[ds.length-1]};
  }
  function hcard(title){var c=el('section',null,'card');if(title)c.appendChild(el('h2',title));return c;}
  function flightRow(f){
    var it=el('div',null,'item'),l=el('div'),t=el('div');
    t.appendChild(el('span',f.dir,'tag'));t.appendChild(document.createTextNode(f.no||'（未填班次）'));l.appendChild(t);
    l.appendChild(routeViz(f));
    l.appendChild(el('small','出發 '+show(f.dep)+'　抵達 '+show(f.arr)));
    if(f.note)l.appendChild(el('small','備註：'+f.note));
    it.appendChild(l);return it;
  }
  function renderTodos(body){
    var done=state.todos.filter(function(t){return t.done;}).length,total=state.todos.length;
    var c=hcard('準備清單　'+done+'／'+total);
    var bar=el('div',null,'bar'),fill=document.createElement('div');fill.style.width=(total?done/total*100:0)+'%';bar.appendChild(fill);c.appendChild(bar);
    state.todos.forEach(function(t){
      var it=el('div',null,'item'),lab=el('label',null,'chk'),cb=document.createElement('input'),sp=el('span',t.text);
      cb.type='checkbox';cb.checked=t.done;cb.onchange=function(){t.done=cb.checked;save();renderHome();};
      if(t.done){sp.style.textDecoration='line-through';sp.style.opacity='.6';}
      lab.style.flex='1';lab.style.margin='0';lab.appendChild(cb);lab.appendChild(sp);it.appendChild(lab);
      it.appendChild(kebab(t.text,[['刪除',function(){state.todos=state.todos.filter(function(x){return x.id!==t.id;});save();renderHome();},true]]));
      c.appendChild(it);
    });
    var ar=el('div',null,'row'),inp=document.createElement('input'),ab=el('button','新增');
    ar.style.marginTop='12px';inp.placeholder='新增待辦事項';inp.setAttribute('aria-label','新增待辦事項');inp.style.flex='1 1 160px';
    ab.onclick=function(){var v=inp.value.trim();if(!v)return;state.todos.push({id:Date.now(),text:v,done:false});save();renderHome();};
    inp.onkeydown=function(e){if(e.key==='Enter')ab.click();};
    ar.appendChild(inp);ar.appendChild(ab);c.appendChild(ar);body.appendChild(c);
  }
  function renderHome(){
    var st=$('hStatus'),body=$('hBody');st.innerHTML='';body.innerHTML='';
    var now=new Date(),today=ymd(now),r=tripRange();
    if(r)body.appendChild(timelineCard(r,today));
    var phase=!r?'empty':(today<r.start?'before':(today>r.end?'after':'during'));
    if(phase==='empty'){
      st.appendChild(el('h2','歡迎使用 TRAVEL PLANNER'));
      st.appendChild(el('div','先到「行程」或「航班」新增資料，主頁就會自動顯示倒數與當天行程。','sub'));
    }else if(phase==='before'){
      var n=dayDiff(today,r.start);
      st.appendChild(el('div',n===1?'明天出發':'還有 '+n+' 天','total'));
      st.appendChild(el('div','出發日 '+fmtMD(r.start),'twd'));
    }else if(phase==='during'){
      var tt=el('div','Day '+(dayDiff(r.start,today)+1)+' ／ 共 '+(dayDiff(r.start,r.end)+1)+' 天','total');tt.style.fontSize='2rem';
      st.appendChild(tt);st.appendChild(el('div',fmtMD(today),'twd'));
    }else{
      st.appendChild(el('div','旅程結束 🏠','total'));
      st.appendChild(el('div','回來辛苦了，到「花費」看總結。','twd'));
    }
    if(phase==='before'){
      var fc=hcard('航班資訊');
      if(!state.flights.length)empty(fc,'還沒有航班，到「航班」分頁新增。');
      else state.flights.slice().sort(function(a,b){return (a.dep||'').localeCompare(b.dep||'');}).forEach(function(f){fc.appendChild(flightRow(f));});
      body.appendChild(fc);
    }
    if(phase==='before'||phase==='empty')renderTodos(body);
    if(phase==='during'){
      var tf=state.flights.filter(function(f){return f.dep&&f.dep.slice(0,10)===today;});
      if(tf.length){var fc2=hcard('今天的航班');tf.forEach(function(f){fc2.appendChild(flightRow(f));});body.appendChild(fc2);}
      var pc=hcard('今天的行程'),list=state.plans.filter(function(p){return p.date===today;}).sort(function(a,b){return (a.time||'99:99').localeCompare(b.time||'99:99');});
      var nowStr=z2(now.getHours())+':'+z2(now.getMinutes()),next=null;
      for(var i=0;i<list.length;i++){if(!list[i].done){next=list[i];break;}}
      if(list.length){var dn=list.filter(function(q){return q.done;}).length,hd=el('div',null,'tprog'),tx=el('div');hd.appendChild(ring(dn/list.length*100,'#2F9E78',dn+'/'+list.length,'',84));tx.appendChild(el('b','今天的進度'));tx.appendChild(el('small',dn===list.length?'今天全部走完了 🎉':'點圓圈標記「已到」'));hd.appendChild(tx);pc.appendChild(hd);}
      if(!list.length)empty(pc,'今天還沒有排行程，到「行程」分頁新增。');
      list.forEach(function(p){
        var it=el('div',null,'item'+(p===next?' next':'')+(p.done?' past':'')),l=el('div'),t=el('div');
        if(p.time)t.appendChild(el('span',p.time,'tag time'));
        if(p===next)t.appendChild(el('span','下一站','tag now'));
        t.appendChild(document.createTextNode(p.name));l.appendChild(t);
        if(p.addr)l.appendChild(el('small',p.addr));
        if(p.note)l.appendChild(el('small','備註：'+p.note));
        var a=el('a','📍','map side');a.href='https://www.google.com/maps/search/?api=1&query='+qs(p);a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','在 Google 地圖開啟：'+p.name);
        var ck=el('button',p.done?'✓':'','stop'+(p.done?' on':''));ck.setAttribute('aria-label',(p.done?'取消完成 ':'標記已到 ')+p.name);ck.setAttribute('aria-pressed',p.done?'true':'false');ck.onclick=function(){p.done=!p.done;save();renderHome();};
        it.appendChild(ck);it.appendChild(l);it.appendChild(a);pc.appendChild(it);
      });
      body.appendChild(pc);
    }
    var bc=budgetCard(r,today);if(bc)body.appendChild(bc);
  }
  $('qAdd').onclick=function(){
    var name=$('qName').value.trim(),yen=parseFloat($('qYen').value);
    if(!name||!(yen>0)){$('qMsg').textContent='請填寫項目和大於 0 的金額。';return;}
    state.items.push({id:Date.now(),name:name,yen:yen,payer:$('qPayer').value,shared:$('qShared').checked,cat:$('qCat').value});
    $('qName').value='';$('qYen').value='';save();renderMoney();
    $('qMsg').textContent='已記下 ¥'+fmt(yen)+'（約 NT$'+fmt(yen*state.rate)+'）✓';
  };
  function ring(pct,color,big,small,size){
    var p=Math.max(0,Math.min(100,pct)),w=el('div',null,'ring'+((size||150)<100?' sm':''));
    w.style.width=w.style.height=(size||150)+'px';
    w.innerHTML=`<svg viewBox='0 0 120 120' width='100%' height='100%'><circle cx='60' cy='60' r='48' fill='none' style='stroke:var(--line)' stroke-width='14'/>${p>0?`<circle cx='60' cy='60' r='48' fill='none' stroke='${color}' stroke-width='14' stroke-linecap='round' stroke-dasharray='${(p*3.016).toFixed(1)} 301.6'/>`:''}</svg>`;
    var c=el('div',null,'c');c.appendChild(el('b',big));if(small)c.appendChild(el('small',small));w.appendChild(c);return w;
  }
  function routeViz(f){var w=el('div',null,'route');w.appendChild(el('b',f.from||'?'));w.appendChild(el('span','✈️','rline'));w.appendChild(el('b',f.to||'?'));return w;}
  function timelineCard(r,today){
    var n=dayDiff(r.start,r.end)+1,c=hcard('旅程時間軸'),tl=el('div',null,'tl');
    for(var k=0;k<Math.min(n,21);k++){
      var d=ymd(new Date(new Date(r.start+'T00:00:00').getTime()+k*86400000));
      var x=el('div',null,'d'+(d<today?' done':'')+(d===today?' today':''));
      x.appendChild(document.createElement('i'));x.appendChild(el('span','D'+(k+1)));x.appendChild(el('small',(+d.slice(5,7))+'/'+(+d.slice(8))));
      tl.appendChild(x);
    }
    c.appendChild(tl);return c;
  }
  function budgetCard(r,today){
    if(!(state.budget>0))return null;
    var t=0;state.items.forEach(function(i){t+=i.yen;});
    var pct=t/state.budget*100,left=state.budget-t,c=hcard('預算');
    c.appendChild(ring(pct,pct>100?'#E5533D':'#F4A259','¥'+fmt(t),'已花 '+Math.round(pct)+'%'));
    var s=el('div',left>=0?'還剩 ¥'+fmt(left)+'（約 NT$'+fmt(left*state.rate)+'）':'已超出預算 ¥'+fmt(-left),'rsub');c.appendChild(s);
    if(r&&today>=r.start&&today<=r.end&&left>0){c.appendChild(el('div','今天起，每天建議不超過 ¥'+fmt(left/(dayDiff(today,r.end)+1)),'rsub sub'));}
    return c;
  }
  var CATS={food:['🍜','餐飲','#E8603C'],transport:['🚃','交通','#6E9BBF'],shop:['🛍️','購物','#F28F7C'],ticket:['🎫','門票','#8FBF8A'],stay:['🏨','住宿','#F4C83A'],other:['✨','其他','#B8A9A0']};
  function renderCharts(){
    var box=$('mCharts');if(!box)return;box.innerHTML='';
    if(!state.items.length){empty(box,'記幾筆花費，這裡就會出現圖表。');return;}
    var sums={},total=0,days={};
    state.items.forEach(function(i){var k=CATS[i.cat]?i.cat:'other';sums[k]=(sums[k]||0)+i.yen;total+=i.yen;var d=ymd(new Date(i.id));days[d]=(days[d]||0)+i.yen;});
    var off=0,segs='';
    Object.keys(sums).forEach(function(k){var len=sums[k]/total*301.6;segs+=`<circle cx='60' cy='60' r='48' fill='none' stroke='${CATS[k][2]}' stroke-width='22' stroke-dasharray='${len.toFixed(1)} 301.6' stroke-dashoffset='${(-off).toFixed(1)}'/>`;off+=len;});
    var pr=el('div',null,'pierow'),pw=el('div',null,'pie'),lg=el('div',null,'legend');
    pw.innerHTML=`<svg viewBox='0 0 120 120' width='100%' height='100%'><circle cx='60' cy='60' r='48' fill='none' style='stroke:var(--line)' stroke-width='22'/>${segs}</svg>`;
    Object.keys(sums).sort(function(a,b){return sums[b]-sums[a];}).forEach(function(k){var row=el('div',null,'lg'),dot=document.createElement('i');dot.style.background=CATS[k][2];row.appendChild(dot);row.appendChild(el('span',CATS[k][0]+' '+CATS[k][1]));row.appendChild(el('small',Math.round(sums[k]/total*100)+'%'));lg.appendChild(row);});
    pr.appendChild(pw);pr.appendChild(lg);
    box.appendChild(el('div','依分類','ctitle'));box.appendChild(pr);
    var keys=Object.keys(days).sort().slice(-7),max=0;keys.forEach(function(k){if(days[k]>max)max=days[k];});
    box.appendChild(el('div','每日花費','ctitle'));
    var bars=el('div',null,'bars');
    keys.forEach(function(k){var col=el('div',null,'bcol'),b=document.createElement('i');b.style.height=Math.max(4,days[k]/max*80)+'px';col.appendChild(el('small','¥'+fmt(days[k])));col.appendChild(b);col.appendChild(el('small',(+k.slice(5,7))+'/'+(+k.slice(8))));bars.appendChild(col);});
    box.appendChild(bars);
  }
  function jumpToday(){var e=$('day-'+ymd(new Date()));if(e)e.scrollIntoView({behavior:'smooth',block:'start'});}
  document.querySelector('[data-tab=home]').addEventListener('click',renderHome);
  document.querySelector('[data-tab=plans]').addEventListener('click',function(){setTimeout(jumpToday,60);});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)renderHome();});

  renderFlights();renderHotels();renderPlans();renderMoney();renderHome();
})();
</script>
</body>
</html>
